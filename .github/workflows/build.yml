name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# One build at a time; a newer push cancels an older build, so "latest" is always the newest commit.
concurrency:
  group: release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk fireplace.apk

      - uses: actions/upload-artifact@v4
        with:
          name: fireplace-apk
          path: fireplace.apk

      # Fixed download link for the TV's Downloader app:
      # https://github.com/<owner>/<repo>/releases/latest/download/fireplace.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Fireplace build ${{ github.run_number }}
          body: "Built from ${{ github.sha }}. Install with the Downloader app on the TV or with adb."
          make_latest: "true"
          files: fireplace.apk
