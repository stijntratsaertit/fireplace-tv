name: Build APK

on:
  push:
    branches: [main, matter-spike]
  workflow_dispatch:

permissions:
  contents: write

# One build at a time; a newer push cancels an older build, so "latest" is always the newest commit.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The Google Home (Matter) plug is Rust, cross-compiled for the TV's 32-bit ARM CPU.
      - name: Set up Rust for Android
        if: hashFiles('matter/Cargo.toml') != ''
        run: |
          rustup target add armv7-linux-androideabi
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk fireplace.apk

      - uses: actions/upload-artifact@v4
        with:
          name: fireplace-apk
          path: fireplace.apk

      # Fixed download link for the TV's Downloader app:
      # https://github.com/<owner>/<repo>/releases/latest/download/fireplace.apk
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Fireplace build ${{ github.run_number }}
          body: "Built from ${{ github.sha }}. Install with the Downloader app on the TV or with adb."
          make_latest: "true"
          files: fireplace.apk

      # Test builds from the matter-spike branch go to their own release, never "latest".
      - name: Publish Matter test build
        if: github.ref == 'refs/heads/matter-spike'
        run: cp fireplace.apk fireplace-spike.apk
      - if: github.ref == 'refs/heads/matter-spike'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: matter-spike
          name: Matter test build
          body: "Test build with the Google Home (Matter) plug, from ${{ github.sha }}. Not the normal app download."
          prerelease: true
          make_latest: "false"
          files: fireplace-spike.apk
