[package]
name = "fireplace-matter"
version = "0.1.0"
edition = "2021"
publish = false
description = "Matter on/off plug that lets Google Home start Winter at Home"

[[bin]]
name = "fireplace-matter"
path = "src/main.rs"

[dependencies]
rs-matter = { version = "=0.4.1", features = ["async-io", "groups", "persistent-subscriptions", "max-groups-per-fabric-12", "max-group-keys-per-fabric-3", "max-group-endpoints-per-fabric-3", "max-sessions-32"] }
log = "0.4"
env_logger = "0.11"
embassy-futures = "0.1"
# Timer driver and queue for running rs-matter on a normal OS (as in rs-matter's examples).
embassy-time = { version = "0.5", features = ["std"] }
embassy-time-queue-utils = { version = "0.3", features = ["generic-queue-64"] }
futures-lite = "2"
async-io = "2"
socket2 = { version = "0.6", features = ["all"] }
if-addrs = "0.15"
rand = { version = "0.10", features = ["std", "std_rng", "thread_rng"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
